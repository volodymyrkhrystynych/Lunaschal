[pytest]
# Repo root on sys.path so tests can `import backend.*`
pythonpath = .
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `isolated_db` (backend/tests/conftest.py) is autouse and copies a ~1MB
# schema-template DB into every test's `tmp_path`, whether the test asked for
# one or not. Pytest's default retention ("all", keep the last 3 sessions)
# means none of that is ever freed until the whole session — ~1,800 tests —
# finishes, which is enough on its own to blow a quota-limited tmp partition.
# "failed" deletes each *passing* test's tmp_path the moment that test ends
# (see _pytest/tmpdir.py's `tmp_path` fixture teardown), so usage stays
# bounded to the tests currently in flight instead of the whole suite; failed
# tests still keep their tmp_path around to debug. retention_count trims that
# down to the latest session only, so a run with failures doesn't stack up
# old debug dirs across repeated invocations either.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
