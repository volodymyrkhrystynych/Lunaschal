name: Simulator
description: Restores a simulator's first boot, or does it and caches the result
# A fresh runner's first boot takes 2-9 minutes. The cache key carries the image
# because a booted device does not survive a move to another one, even with the
# same runtime build: restored that way, apps failed to launch on a third of
# shards. Hosted images roll out gradually, so one run can use two, and the first
# shard on each pays for the boot.
inputs:
  device:
    description: iPhone or iPad
    required: true
runs:
  using: composite
  steps:
    - id: image
      shell: bash
      run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: simulator.tar
        key: simulator-${{ inputs.device }}-${{ steps.image.outputs.version }}
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: apple/tools/simulator_snapshot.sh restore ${{ inputs.device }} simulator.tar
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: apple/tools/simulator_snapshot.sh save ${{ inputs.device }} simulator.tar
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: simulator.tar
        key: simulator-${{ inputs.device }}-${{ steps.image.outputs.version }}
