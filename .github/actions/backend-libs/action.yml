name: Backend system libraries
description: Installs the backend's apt packages from a cache of their .debs
# A slow Ubuntu mirror once held this step for 41 minutes while a job beside it
# took four seconds, and every shard takes that chance. Installing from the
# cache needs no mirror at all; the key carries the runner image because what
# has to be downloaded depends on what the image already has.
runs:
  using: composite
  steps:
    - id: image
      shell: bash
      run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ~/apt-debs
        key: backend-libs-${{ steps.image.outputs.version }}-${{ hashFiles('.github/actions/backend-libs/action.yml') }}
    - shell: bash
      run: |
        if compgen -G "$HOME/apt-debs/*.deb" > /dev/null && sudo dpkg -i "$HOME"/apt-debs/*.deb; then
          exit 0
        fi
        # The EGL/X/NSS libraries are QtWebEngine's: test_main_entrypoint
        # builds the desktop window's profile, which imports it for real.
        packages=(
          libpango-1.0-0 libpangoft2-1.0-0 ffmpeg ripgrep libsndfile1
          libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libnss3 libxcomposite1
          libxdamage1 libxrandr2 libxtst6 libxshmfence1 libasound2t64 libfontconfig1 libdbus-1-3
        )
        apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
        sudo apt-get "${apt_options[@]}" update -q
        sudo apt-get "${apt_options[@]}" install -yq --no-install-recommends --download-only "${packages[@]}"
        mkdir -p "$HOME/apt-debs"
        cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/"
        sudo apt-get "${apt_options[@]}" install -yq --no-install-recommends "${packages[@]}"
