name: Apple signed release
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unique Apple build number (for example 1.2)
        required: true
        type: string
      upload_to_testflight:
        description: Upload this build to App Store Connect for TestFlight processing
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: apple-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Select the tip of main
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          if not re.fullmatch(r'[1-9][0-9]{0,3}(?:\.[0-9]{1,2}){0,2}', os.environ['BUILD_NUMBER']):
              raise SystemExit('Invalid build number')
          repo = os.environ['GH_REPO']
          # Releases ship main as it is now, whether or not its Apple app CI
          # run has passed (or finished): waiting on a slow or flaky simulator
          # run once built the previous commit instead of the fix being shipped.
          commit = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/commits/main']))['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Invalid commit returned by GitHub')
          # Say what that commit's CI said, for the record; it never blocks.
          try:
              runs = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/{repo}/actions/workflows/apple.yml/runs?head_sha={commit}&per_page=20'
              ]))['workflow_runs']
              runs = [r for r in runs if r['head_repository']['full_name'] == repo]
              state = (runs[0]['conclusion'] or runs[0]['status']) if runs else 'no run'
          except Exception:
              state = 'unknown'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'commit={commit}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Selected main: [{commit}](https://github.com/{repo}/commit/{commit})'
                            f' (Apple app CI: {state})\n')
          PY
  archive:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 30
    environment: apple-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Set temporary signing paths
        run: |
          echo "SIGNING_DIR=$RUNNER_TEMP/lunaschal-signing" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$RUNNER_TEMP/lunaschal-signing.keychain-db" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Install project generator and create icons
        run: |
          brew install xcodegen
          swift apple/tools/make_icons.swift
          xcodegen generate --spec apple/project.yml
      - name: Import and validate distribution credentials
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID || '4AG98Q33RQ' }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.APPLE_IOS_PROFILE_BASE64 }}
          WATCH_PROFILE: ${{ secrets.APPLE_WATCH_PROFILE_BASE64 }}
          COMPLICATIONS_PROFILE: ${{ secrets.APPLE_COMPLICATIONS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$SIGNING_DIR"
          python3 - <<'PY'
          import base64, os, pathlib
          root = pathlib.Path(os.environ['SIGNING_DIR'])
          for name, variable in [('certificate.p12', 'CERTIFICATE'), ('ios.mobileprovision', 'IOS_PROFILE'), ('watch.mobileprovision', 'WATCH_PROFILE'), ('complications.mobileprovision', 'COMPLICATIONS_PROFILE')]:
              value = os.environ[variable]
              if not value:
                  raise SystemExit(f'Missing {variable} secret')
              (root / name).write_bytes(base64.b64decode(value, validate=True))
          PY
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security import "$SIGNING_DIR/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN" > "$SIGNING_DIR/identities.txt"
          security cms -D -i "$SIGNING_DIR/ios.mobileprovision" > "$SIGNING_DIR/ios.plist"
          security cms -D -i "$SIGNING_DIR/watch.mobileprovision" > "$SIGNING_DIR/watch.plist"
          security cms -D -i "$SIGNING_DIR/complications.mobileprovision" > "$SIGNING_DIR/complications.plist"
          python3 apple/tools/release.py --directory "$SIGNING_DIR" --team "$TEAM_ID" --build "$BUILD_NUMBER"
          python3 - <<'PY'
          import os, pathlib, plistlib, shutil
          root = pathlib.Path(os.environ['SIGNING_DIR'])
          destination = pathlib.Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
          destination.mkdir(parents=True, exist_ok=True)
          installed = []
          for name in ('ios', 'watch', 'complications'):
              profile = plistlib.loads((root / f'{name}.plist').read_bytes())
              target = destination / (profile['UUID'] + '.mobileprovision')
              if target.exists():
                  raise SystemExit('Refusing to replace an existing provisioning profile')
              shutil.copyfile(root / f'{name}.mobileprovision', target)
              installed.append(str(target))
              (root / 'installed-profiles.txt').write_text('\n'.join(installed))
          PY
      - name: Archive and export signed app
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          xcodebuild -project apple/Lunaschal.xcodeproj -scheme Lunaschal \
            -configuration Release -destination 'generic/platform=iOS' \
            -xcconfig "$SIGNING_DIR/Signing.xcconfig" \
            -archivePath "$RUNNER_TEMP/Lunaschal.xcarchive" archive
          # Fails here, before signing and upload, if the build number was ignored.
          python3 apple/tools/check_archive.py "$RUNNER_TEMP/Lunaschal.xcarchive" "$BUILD_NUMBER"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Lunaschal.xcarchive" \
            -exportOptionsPlist "$SIGNING_DIR/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/Lunaschal-export"
      - uses: actions/upload-artifact@v4
        with:
          name: lunaschal-signed-${{ inputs.build_number }}
          path: ${{ runner.temp }}/Lunaschal-export/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Explicit TestFlight upload
        if: inputs.upload_to_testflight
        env:
          API_KEY: ${{ secrets.APPSTORECONNECT_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPSTORECONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORECONNECT_ISSUER_ID }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, os, pathlib, re
          if not re.fullmatch(r'[A-Z0-9]{10}', os.environ['API_KEY_ID']):
              raise SystemExit('Invalid App Store Connect key ID')
          if not re.fullmatch(r'[a-fA-F0-9-]{36}', os.environ['API_ISSUER']):
              raise SystemExit('Invalid App Store Connect issuer ID')
          value = base64.b64decode(os.environ['API_KEY'], validate=True)
          if not value.startswith(b'-----BEGIN PRIVATE KEY-----'):
              raise SystemExit('Missing App Store Connect private key')
          (pathlib.Path(os.environ['SIGNING_DIR']) / 'AuthKey.p8').write_bytes(value)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Lunaschal.xcarchive" \
            -exportOptionsPlist "$SIGNING_DIR/UploadOptions.plist" \
            -exportPath "$RUNNER_TEMP/Lunaschal-upload" \
            -authenticationKeyPath "$SIGNING_DIR/AuthKey.p8" \
            -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER" \
            -allowProvisioningUpdates
      - name: Remove signing material
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['SIGNING_DIR'])
          record = root / 'installed-profiles.txt'
          if record.exists():
              for filename in record.read_text().splitlines():
                  pathlib.Path(filename).unlink(missing_ok=True)
          shutil.rmtree(root, ignore_errors=True)
          PY
          security delete-keychain "$KEYCHAIN" || true
