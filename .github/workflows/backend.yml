name: Backend
# Pull requests and pushes to main. Unlike the Apple workflow, the push matters
# here: a PR's checks run on the PR merged with main as it was *then*, so two
# PRs that each pass alone can still break main together. #193 and #194 each
# added the same Flask route, git merged both copies without a conflict, and
# production crash-looped on startup — any run of this suite on main would have
# failed at the first `create_app()`.
on:
  pull_request:
    paths-ignore: ['apple/**', 'docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['apple/**', 'docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Seconds, not minutes: the same check the deploy watcher runs before it
  # restarts production, so a red mark here means the watcher will refuse it.
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries (WeasyPrint)
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      # openai-whisper pulls torch, and PyPI's default torch wheel is the
      # multi-gigabyte CUDA build. Nothing here needs a GPU.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - name: Boot create_app()
        run: python backend/ops/smoke.py --db "$RUNNER_TEMP/fresh.db"

  # Six jobs because the suite takes ~24 minutes in one process, and no job
  # here should pass ten. Shards are balanced by scripts/backend_shards.py.
  pytest:
    name: pytest ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: ./.github/actions/backend-libs
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # PyQt6-WebEngine is the window's renderer; pywebview's Qt backend
      # imports it, but nothing in requirements.txt names it.
      - run: pip install -r requirements-dev.txt PyQt6-WebEngine
      - name: Choose this shard's files
        # Not inlined as $(...): a selector error there would leave pytest with
        # no paths, and pytest with no paths runs the whole suite.
        run: python scripts/backend_shards.py ${{ matrix.shard }} ${{ strategy.job-total }} > "$RUNNER_TEMP/test-files.txt"
      - run: xargs python -m pytest -q < "$RUNNER_TEMP/test-files.txt"
        env:
          QT_QPA_PLATFORM: offscreen
