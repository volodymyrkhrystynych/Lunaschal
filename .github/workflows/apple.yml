name: Apple app
# Pull requests (and by hand) only. A push to main is the merge of a PR that
# already ran this, and the signed release builds main without waiting on it,
# so testing every push only queued a second full run.
on:
  pull_request:
    paths: ['apple/**', '.github/workflows/apple.yml', '.github/actions/xcode-project/**', '.github/actions/simulator/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
# No job should take more than ten minutes, so a failure can be rerun on its own
# without waiting half an hour. What made a simulator job long was not only its
# tests: a fresh runner's first simulator boot takes 2-9 minutes, and every job
# compiled the app for itself. simulator-build compiles once, and the simulator
# action caches each device's first boot per runner image.
#
# GitHub runs at most five macOS jobs at once, across every open PR, so shards
# beyond the fifth queue. A shard is ~3.5 minutes of download and boot and ~5 of
# tests, so the sixteen take about half an hour when no other PR holds the Macs.
#
# Simulator UI tests flake on slow runners, so each failing test gets one retry,
# and a test stuck for 5 minutes (one once hung 12 on a tap) is stopped and
# retried. Job timeouts leave room for those retries beyond the ten-minute aim.
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.2-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apple/LunaschalCore

  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test release and CI helpers
        run: python3 -m unittest discover -s apple/tools -p 'test_*.py'

  archive:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xcode-project
      - name: Verify unsigned device archive
        run: |
          xcodebuild -project apple/Lunaschal.xcodeproj -scheme Lunaschal \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath apple/Lunaschal.xcarchive CODE_SIGNING_ALLOWED=NO archive
          python3 apple/tools/check_archive.py apple/Lunaschal.xcarchive

  watch:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xcode-project
      - name: Build Watch companion
        run: |
          xcodebuild -project apple/Lunaschal.xcodeproj -scheme LunaschalWatch \
            -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath apple/WatchDerivedData CODE_SIGNING_ALLOWED=NO build

  simulator-build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/xcode-project
      - name: Build for testing
        # Hosted Macs are arm64, and the one simulator build runs on iPhone and iPad.
        run: |
          xcodebuild -project apple/Lunaschal.xcodeproj -scheme Lunaschal \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath apple/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build-for-testing
          # The photo-picker test's picture: generated above, so not in a checkout.
          cp apple/App/Assets.xcassets/AppIcon.appiconset/Icon.png apple/DerivedData/Build/Products/test-photo.png
          tar -C apple/DerivedData/Build -cf simulator-build.tar Products
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-build
          path: simulator-build.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  ui:
    name: ${{ matrix.device }} ${{ matrix.shard }}/${{ matrix.total }}
    needs: simulator-build
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: iPhone, shard: 1, total: 12 }
          - { device: iPhone, shard: 2, total: 12 }
          - { device: iPhone, shard: 3, total: 12 }
          - { device: iPhone, shard: 4, total: 12 }
          - { device: iPhone, shard: 5, total: 12 }
          - { device: iPhone, shard: 6, total: 12 }
          - { device: iPhone, shard: 7, total: 12 }
          - { device: iPhone, shard: 8, total: 12 }
          - { device: iPhone, shard: 9, total: 12 }
          - { device: iPhone, shard: 10, total: 12 }
          - { device: iPhone, shard: 11, total: 12 }
          - { device: iPhone, shard: 12, total: 12 }
          - { device: iPad, shard: 1, total: 4 }
          - { device: iPad, shard: 2, total: 4 }
          - { device: iPad, shard: 3, total: 4 }
          - { device: iPad, shard: 4, total: 4 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: simulator-build
      - name: Unpack build
        run: |
          mkdir -p apple/DerivedData/Build
          tar -C apple/DerivedData/Build -xf simulator-build.tar
      - uses: ./.github/actions/simulator
        with:
          device: ${{ matrix.device }}
      - name: Test on ${{ matrix.device }} simulator
        run: apple/tools/run_ui_shard.sh ${{ matrix.device }} ${{ matrix.shard }} ${{ matrix.total }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apple-test-results-${{ matrix.device }}-${{ matrix.shard }}
          path: apple/TestResults.xcresult
          if-no-files-found: ignore
