name: Apple app
# Pull requests (and by hand) only. A push to main is the merge of a PR that
# already ran this, and the signed release builds main without waiting on it,
# so testing every push only queued a second 40-minute run.
on:
  pull_request:
    paths: ['apple/**', '.github/workflows/apple.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
# The simulator work used to be one job of ~40 minutes. It is now split across
# parallel macOS jobs, each building for itself (~5 min) and then running its
# share: the device archive and Watch build, five shards of the iPhone UI
# tests (app unit tests in the first), and the iPad-only tests. Simulator UI
# tests flake on slow runners, so each failing test gets one retry, and a test
# stuck for 5 minutes (one once hung 12 on a tap) is stopped and retried.
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.2-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apple/LunaschalCore

  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test release and CI helpers
        run: python3 -m unittest discover -s apple/tools -p 'test_*.py'

  archive:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          swift apple/tools/make_icons.swift
          xcodegen generate --spec apple/project.yml
      - name: Verify unsigned device archive
        run: |
          xcodebuild -project apple/Lunaschal.xcodeproj -scheme Lunaschal \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath apple/Lunaschal.xcarchive CODE_SIGNING_ALLOWED=NO archive
          python3 apple/tools/check_archive.py apple/Lunaschal.xcarchive
      - name: Build Watch companion
        run: |
          xcodebuild -project apple/Lunaschal.xcodeproj -scheme LunaschalWatch \
            -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath apple/WatchDerivedData CODE_SIGNING_ALLOWED=NO build

  iphone:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          swift apple/tools/make_icons.swift
          xcodegen generate --spec apple/project.yml
      - name: Test on iPhone simulator (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        shell: bash
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          selection=()
          # Finish first-boot setup before XCTest starts its launch deadline.
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          # The photo-picker test must not depend on stock simulator photos.
          xcrun simctl addmedia "$simulator_id" apple/App/Assets.xcassets/AppIcon.appiconset/Icon.png
          # A selector error must stop the job, not accidentally run the full suite.
          python3 apple/tools/ui_shards.py apple/UITests ${{ matrix.shard }} ${{ strategy.job-total }} > "$RUNNER_TEMP/ui-selection.txt"
          while IFS= read -r test; do selection+=("$test"); done < "$RUNNER_TEMP/ui-selection.txt"
          if [ "${{ matrix.shard }}" = 1 ]; then selection+=("-only-testing:LunaschalAppTests"); fi
          xcodebuild -project apple/Lunaschal.xcodeproj -scheme Lunaschal \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -parallel-testing-enabled NO -destination-timeout 120 \
            -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -derivedDataPath apple/DerivedData -resultBundlePath apple/TestResults.xcresult \
            "${selection[@]}" CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apple-test-results-iphone-${{ matrix.shard }}
          path: apple/TestResults.xcresult
          if-no-files-found: ignore

  ipad:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          swift apple/tools/make_icons.swift
          xcodegen generate --spec apple/project.yml
      - name: Test iPad-only screens
        shell: bash
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPad" in d["name"]))')
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          xcodebuild -project apple/Lunaschal.xcodeproj -scheme Lunaschal \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -parallel-testing-enabled NO -destination-timeout 120 \
            -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -derivedDataPath apple/DerivedData -resultBundlePath apple/TestResults.xcresult \
            -only-testing:LunaschalUITests/OfflineCaptureTests/testDrawingWorkspaceReopensWithoutAServer \
            -only-testing:LunaschalUITests/OfflineCaptureTests/testLibraryCategoriesAndDownloadSettingsAreSeparate \
            -only-testing:LunaschalUITests/OfflineCaptureTests/testNotebookFillsTheWindowContinuesFromDrawAndSavesToTheJournal \
            -only-testing:LunaschalUITests/OfflineCaptureTests/testNewspaperScrollsAsOneColumn \
            -only-testing:LunaschalUITests/OfflineCaptureTests/testNotesPagesTurnWithASwipe \
            -only-testing:LunaschalUITests/OfflineCaptureTests/testNotesComeBackFromTheEntryDraftAndSaveWithIt \
            CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apple-test-results-ipad
          path: apple/TestResults.xcresult
          if-no-files-found: ignore
