<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lunaschal Apply</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font:
          13px/1.45 system-ui,
          sans-serif;
        background: #18181b;
        color: #f4f4f5;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      .muted {
        color: #a1a1aa;
      }
      .error {
        color: #fca5a5;
      }
      .card {
        border: 1px solid #3f3f46;
        border-radius: 8px;
        padding: 8px;
        margin-bottom: 10px;
      }
      button {
        width: 100%;
        cursor: pointer;
        padding: 7px 8px;
        margin-top: 6px;
        border-radius: 6px;
        border: 1px solid #3f3f46;
        background: #27272a;
        color: #f4f4f5;
        font: inherit;
      }
      button:hover:not(:disabled) {
        background: #3f3f46;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.recording {
        border-color: #b91c1c;
        color: #fca5a5;
      }
      select {
        width: 100%;
        padding: 6px;
        background: #27272a;
        color: #f4f4f5;
        border: 1px solid #3f3f46;
        border-radius: 6px;
        font: inherit;
      }
      a {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <h1>Lunaschal Apply</h1>
    <div id="status" class="card muted">Checking…</div>

    <div id="picker" class="card" hidden>
      <div class="muted" style="margin-bottom: 6px">
        Application for this tab
      </div>
      <select id="applications"></select>
      <button id="choose">Use this application</button>
    </div>

    <button id="fill" disabled>Fill this form</button>
    <button id="resume" disabled>Attach my resume</button>
    <button id="dictate" disabled>Dictate into the last field</button>

    <p class="muted" style="margin: 10px 0 0">
      <a href="#" id="options">Settings</a>
    </p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
