name: Lunaschal
options:
  bundleIdPrefix: com.lunaschal
  deploymentTarget:
    iOS: '26.0'
    watchOS: '26.0'
packages:
  LunaschalCore:
    path: LunaschalCore
settings:
  base:
    APPLE_TEAM_ID: '4AG98Q33RQ'
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Lunaschal:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: LunaschalCore
      - target: LunaschalWatch
        embed: true
      - target: LunaschalShare
        embed: true
      - sdk: HealthKit.framework
    entitlements:
      path: App/Lunaschal.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Shared with the share extension: the session it imports with
        # (SharedSignIn) and the links waiting for the server.
        com.apple.security.application-groups: [group.com.lunaschal.mobile]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lunaschal.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 4
        MARKETING_VERSION: '1'
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
          CODE_SIGN_IDENTITY: $(APPLE_SIGNING_IDENTITY)
          PROVISIONING_PROFILE_SPECIFIER: $(LUNASCHAL_IOS_PROFILE_UUID)
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Lunaschal
        # XcodeGen writes 1 / 1.0 here unless told otherwise, which silently
        # ignored the release workflow's build number: every upload was build 1.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Record thoughts and save the original audio in your journal.
        NSCameraUsageDescription: Take photos to attach to your journal entries.
        NSLocationWhenInUseUsageDescription: Record where a journal or food entry was written, and show the weather there.
        NSLocalNetworkUsageDescription: Connect to your personal Lunaschal server.
        NSHealthShareUsageDescription: Copy your sleep, workouts, exercise minutes and other Health data to your own Lunaschal server, so wake and sleep times fill in automatically and you can analyse it there.
        NSHealthUpdateUsageDescription: Lunaschal doesn't write to Health; it only copies your Health data to your own Lunaschal server.
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.lunaschal.mobile.sync]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  LunaschalWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - WatchShared
      - App/Recorder.swift
    dependencies:
      - package: LunaschalCore
      - target: LunaschalWatchWidgets
        embed: true
    # The App Group carries the timer's state to the complications, which run
    # in their own process. Release profiles for both bundles must include it.
    entitlements:
      path: Generated/Watch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lunaschal.mobile.watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lunaschal.mobile.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # WatchShared/WatchIntents.swift is compiled into both Watch targets;
        # only the app has a recorder for the recording intent to drive.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WATCH_APP
        CURRENT_PROJECT_VERSION: 4
        MARKETING_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '4'
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
          CODE_SIGN_IDENTITY: $(APPLE_SIGNING_IDENTITY)
          PROVISIONING_PROFILE_SPECIFIER: $(LUNASCHAL_WATCH_PROFILE_UUID)
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: Lunaschal
        # XcodeGen writes 1 / 1.0 here unless told otherwise, which silently
        # ignored the release workflow's build number: every upload was build 1.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.lunaschal.mobile
        WKRunsIndependentlyOfCompanionApp: false
        NSMicrophoneUsageDescription: Record thoughts for your journal, even while your phone is unavailable.
        UIBackgroundModes: [audio]
  LunaschalWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [WatchWidgets, WatchShared]
    dependencies:
      - package: LunaschalCore
    entitlements:
      path: Generated/WatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lunaschal.mobile.watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lunaschal.mobile.watchkitapp.widgets
        CURRENT_PROJECT_VERSION: 4
        MARKETING_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '4'
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
          CODE_SIGN_IDENTITY: $(APPLE_SIGNING_IDENTITY)
          PROVISIONING_PROFILE_SPECIFIER: $(LUNASCHAL_COMPLICATIONS_PROFILE_UUID)
    info:
      path: Generated/WatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: Lunaschal
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LunaschalShare:
    type: app-extension
    platform: iOS
    sources: [Share, Shared]
    dependencies:
      - package: LunaschalCore
    entitlements:
      path: Generated/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lunaschal.mobile]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lunaschal.mobile.share
        CURRENT_PROJECT_VERSION: 4
        MARKETING_VERSION: '1'
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
          CODE_SIGN_IDENTITY: $(APPLE_SIGNING_IDENTITY)
          PROVISIONING_PROFILE_SPECIFIER: $(LUNASCHAL_SHARE_PROFILE_UUID)
    info:
      path: Generated/Share-Info.plist
      properties:
        CFBundleDisplayName: Lunaschal
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # A web page's link, or text with one in it: whether it is a fic
            # is decided inside, against the server's list of sites; a YouTube
            # video instead joins the Capture composer's draft.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  LunaschalAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Lunaschal
      - package: LunaschalCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LunaschalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Lunaschal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LunaschalWatch:
    build:
      targets:
        LunaschalWatch: all
  Lunaschal:
    build:
      targets:
        Lunaschal: all
    test:
      targets: [LunaschalAppTests, LunaschalUITests]
