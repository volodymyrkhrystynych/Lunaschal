; llama-server router presets for Lunaschal's TEST ENVIRONMENT (test-env.sh).
;
; Same section names as llama/presets.ini on purpose: the app calls these
; aliases by name (backend/ai/provider.py: DEFAULT_MODEL = 'qwen36',
; EMBED_MODEL = 'embed'), never a file path, so which presets file
; llama-server loaded is the entire mechanism here — nothing else has to
; change between a real server and this one.
;
; Used only when no llama-server is already listening on :8080 (test-env.sh
; probes that before ever touching this file) — i.e. the weak-laptop case,
; where there is no GPU to speak of and everything below runs on CPU.
;
; Nothing here is auto-downloaded. Fetch the tiny chat model once:
;
;   hf download Qwen/Qwen2.5-1.5B-Instruct-GGUF --include "*q4_k_m*" \
;     --local-dir ~/.cache/llama.cpp/tiny
;
; Kept in its own subdirectory so it can never collide with a production
; filename — llama/presets.ini's own [gemma4-12b-omni] comment describes
; exactly that collision happening once with a shared mmproj filename.
; [embed] below is the real presets.ini's model, unmodified: nomic-embed-
; text-v1.5 is already ~140MB and CPU-only, so there's no reason to shrink it
; further for a test run.

version = 1

[*]
jinja      = true
flash-attn = auto

[qwen36]
; Any small CPU-friendly instruct GGUF works here; this one is a reasonable
; default. Swap the path if you'd rather use a different tiny model — nothing
; downstream cares which one, since the app only ever calls the alias.
model        = /home/volodya/.cache/llama.cpp/tiny/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
ctx-size     = 8192
n-gpu-layers = 0
threads      = 4

[embed]
model        = /home/volodya/.cache/llama.cpp/nomic-embed-text-v1.5.Q8_0.gguf
embeddings   = true
pooling      = mean
ctx-size     = 2048
n-gpu-layers = 0

; [gemma4-12b-omni] intentionally omitted. llama_vision_model/llama_audio_model
; default to NULL (off) in a stock init_db(), matching production's own
; resting default until a user enables the toggle — so nothing in the test
; environment ever calls this alias. Photo-captioning and audio-description
; paths won't produce real output in tiny mode unless a small vision-capable
; GGUF (e.g. SmolVLM-500M-Instruct) is added here later and the toggle is
; turned on in Settings.
