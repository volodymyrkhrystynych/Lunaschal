; llama-server router presets for Lunaschal.
;
; Section names are the aliases the app sends in the OpenAI `model` field
; (backend/ai/provider.py: DEFAULT_MODEL / EMBED_MODEL). Keys are llama-server
; long options without the leading dashes.
;
; The whole point of this file is tensor placement. Gemma 4 26B A4B is ~17 GB at
; Q4 and the RTX 3070 has 7.8 GB usable, of which the desktop already holds
; ~1.7 GB. Rather than let whole layers spill to the CPU (what Ollama did), we
; keep every layer's attention, KV cache, router, shared expert and norms in VRAM
; and push only the *routed expert* weights to system RAM, where the 8-of-128
; activation means each token reads a small fraction of them.
;
; n-cpu-moe is THE tuning knob and it is hardware-specific: it keeps the experts
; of the first N of 30 layers on the CPU, so a lower number puts more experts on
; the GPU and is faster right up until it doesn't fit, at which point performance
; falls off a cliff. Re-measure with llama-bench after any VRAM change (a new
; browser, a second monitor) — see docs/learnings/moe-expert-placement.md.

version = 1

[*]
; Applied to every preset below.
; Sampling comes from Google's published recommendation for Gemma 4. It lives here
; rather than in the app because llama.cpp has no per-model baked-in params the way
; Ollama's manifests did — if we don't set them, we get llama.cpp's generic
; defaults, which are not tuned for this model.
temp        = 1.0
top-p       = 0.95
top-k       = 64
; Required for Gemma 4: applies the model's own chat template, and enables the
; peg-gemma4 parser that turns native <|tool_call>call:NAME{...} output into
; OpenAI-shaped tool_calls (backend/ai/llm.py: chat_with_tools).
jinja       = true
flash-attn  = on
; 8 physical cores. Deliberately not 16 — the expert GEMVs are memory-bound and
; SMT siblings just contend for the same load ports.
threads     = 8

[gemma4]
; Explicit path rather than `hf =` on purpose: the -hf path also downloads and
; loads the vision mmproj, which is ~1.1 GB of VRAM we have no use for yet.
model         = /home/volodya/.cache/llama.cpp/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
; Two slots at 24K each. Two, so a background structured call (grading, journal
; polish) can't block an interactive chat message behind it; not more, because
; each slot costs its own KV cache.
ctx-size      = 49152
parallel      = 2
n-gpu-layers  = 999
; MEASURED, not derived: 28 is the smallest value that loads with this ctx-size,
; parallel and ubatch-size on a 7.8 GB card with ~1.7 GB of desktop already on it.
; It sits at 5604 MiB, leaving ~870 MiB of headroom — which is the point, since
; the desktop baseline moves when browser tabs open. 26 and 27 both die trying to
; allocate a 767 MiB compute buffer. See docs/learnings/moe-expert-placement.md.
n-cpu-moe     = 28
; q8_0 KV roughly halves cache cost for no quality change worth measuring, and
; buys ~2 more layers of GPU-resident experts. Needs flash-attn, set globally.
cache-type-k  = q8_0
cache-type-v  = q8_0
; Large batches let prompt processing run on the GPU even for CPU-resident
; experts, which is where this setup beats whole-layer offload most.
batch-size    = 2048
ubatch-size   = 2048
; Do NOT add swa-full. 25 of 30 layers use 1024-token sliding-window attention and
; only the other 5 scale with context; swa-full would give all 30 a full-size
; cache — about 8 GB instead of 1.2 GB here, which simply will not load.
;
; The vision tower is ~1.1 GB of VRAM we have no use for yet (image input is not
; wired into the app), and -hf would otherwise download and load it automatically.
mmproj-auto   = false

[gemma4-medium]
; Balanced context and speed. Uses q8_0 KV cache for high accuracy.
; 90k context fits comfortably in VRAM with q8_0 and n-cpu-moe=28.
model         = /home/volodya/.cache/llama.cpp/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
ctx-size      = 90000
parallel      = 1
n-gpu-layers  = 999
n-cpu-moe     = 28
cache-type-k  = q8_0
cache-type-v  = q8_0
batch-size    = 2048
ubatch-size   = 2048
mmproj-auto   = false

[gemma4-max]
; The absolute limit: 256k context.
; To fit this in VRAM, we use q4_0 KV cache quantization and push all 30 layers'
; experts to the CPU. Note: q4_0 KV cache may reduce model consistency/reasoning
; compared to q8_0. Also expect very slow prompt processing (prefill) for large
; inputs due to CPU-side experts and system RAM bandwidth.
model         = /home/volodya/.cache/llama.cpp/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
ctx-size      = 256000
parallel      = 1
n-gpu-layers  = 999
n-cpu-moe     = 30
cache-type-k  = q4_0
cache-type-v  = q4_0
batch-size    = 2048
ubatch-size   = 2048
mmproj-auto   = false

[gemma4-e4b-audio]
mmproj-offload = false
; Describes non-speech audio content for journal attachments (backend/ai/audio_description.py)
; — "a dog barking, a door slamming" — distinct from the Parakeet/Whisper speech
; transcript, which stays the primary text for what was said.
;
; Deliberately NOT the 26B model: audio input is a capability of the E2B/E4B/12B
; "encoder-free" Gemma 4 variants only, not the 26B A4B MoE this router already
; loads for chat — different weights entirely. And deliberately CPU-only
; (n-gpu-layers = 0): this runs as an opt-in background job with no one waiting
; on it, so there's no reason to fight the 26B preset for the 7.8 GB card: keep
; the ~4.5 GB Q4 weights resident in system RAM instead, same reasoning as
; WHISPER_DEVICE defaulting to cpu (backend/routes/stt.py).
;
; Not downloaded by default — grab weights + the audio-capable mmproj before
; this preset will load:
;   hf download unsloth/gemma-4-E4B-it-GGUF --include "*UD-Q4_K_XL*" \
;     --local-dir ~/.cache/llama.cpp
;   hf download unsloth/gemma-4-E4B-it-GGUF --include "*mmproj-BF16*" \
;     --local-dir ~/.cache/llama.cpp
; then set this alias as the audio model in Settings → llama.cpp.
model         = /home/volodya/.cache/llama.cpp/gemma-4-E4B-it-UD-Q4_K_XL.gguf
mmproj        = /home/volodya/.cache/llama.cpp/mmproj-BF16.gguf
; Mirrored as _CONTEXT_TOKENS in backend/ai/audio_description.py — change both
; together. The audio encoder spends a token per 160 ms frame, so this number is
; a *duration* limit (~42 minutes) more than a text one, and it's what sets how
; long a slice of a recording that module may send in one call.
ctx-size      = 16384
n-gpu-layers  = 0
threads       = 8

[embed]
; Still nomic-embed-text-v1.5, not a newer/better embedder, and that is
; deliberate: Learning stores answer embeddings as float32 blobs on
; learning_cards and compares them by cosine similarity. A different model would
; put new vectors in a different space and silently corrupt every comparison
; against an old one. See backend/ai/embeddings.py.
model         = /home/volodya/.cache/llama.cpp/nomic-embed-text-v1.5.Q8_0.gguf
embeddings    = true
pooling       = mean
ctx-size      = 2048
n-gpu-layers  = 0
; Tiny (~140 MB) and called rarely, but it has to stay resident alongside the
; chat model — an eviction would mean reloading 17 GB on the next chat message.
