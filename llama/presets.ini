; llama-server router presets for Lunaschal.
;
; Section names are the aliases the app sends in the OpenAI `model` field
; (backend/ai/provider.py: DEFAULT_MODEL / EMBED_MODEL). Keys are llama-server
; long options without the leading dashes.
;
; Two things this file exists to get right: tensor placement, and context budget.
;
; TENSOR PLACEMENT. Qwen3.6 35B A3B is ~22 GB at Q4 and the RTX 3070 has 7.8 GB
; usable, of which the desktop already holds ~1.7 GB. Rather than let whole
; layers spill to the CPU (what Ollama did), we keep every layer's attention, KV
; cache, router, shared expert and norms in VRAM and push only the *routed
; expert* weights to system RAM, where the 8-of-256 activation means each token
; reads a small fraction of them. n-cpu-moe is THE tuning knob and it is
; hardware-specific — see docs/learnings/moe-expert-placement.md for the method.
;
; CONTEXT BUDGET. Only 10 of Qwen3.6's 40 layers keep a cache that grows with
; context, and those 10 have just 2 KV heads apiece. That is what makes 190k
; context fit on this card at all — the full derivation, and the measurement it
; was checked against, are in docs/learnings/qwen36-context-budget.md.

version = 1

[*]
; Applied to every preset below. Deliberately NOT sampling parameters: this file
; now holds two different model families, and Gemma's recommended sampler
; (top-k 64) is not Qwen's (top-k 20, min-p 0). Sampling lives per-section.
;
; jinja applies each model's own chat template and enables llama-server's
; tool-call autoparser, which derives the parser from that template — that is
; what turns native tool-call notation into OpenAI-shaped `tool_calls`
; (backend/ai/llm.py: chat_with_tools).
jinja       = true
flash-attn  = on
; 8 physical cores. Deliberately not 16 — the expert GEMVs are memory-bound and
; SMT siblings just contend for the same load ports.
threads     = 8

[qwen36]
; The one conversational model. Replaced Gemma 4 26B A4B purely for context:
; Gemma cost 21.25 KiB/token of KV at q8_0 and topped out near 90k on this card,
; where this model costs 10.6 KiB/token and reaches 190k in the same VRAM.
;
; The halving is a property of the architecture, not the quantization. Of 40
; layers only every 4th uses full attention — 10 layers, each with 2 KV heads of
; head_dim 256, so 10 x 2 x 256 x 2 = 10,240 values per token. The other 30 are
; Gated DeltaNet: linear attention carrying a *fixed* recurrent state instead of
; a cache that grows. Gemma also had a majority of cheap layers (25 of 30 on a
; 1024-token sliding window) but its 5 full-attention layers had 8 KV heads, and
; 4x the heads over half the layers is where the 2x came from.
model         = /home/volodya/.cache/llama.cpp/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
; 190,000 x 10,880 B ~= 2.07 GB of KV — the same budget that was measured to load
; comfortably under the old Gemma preset at 90k, which is why this number and not
; the model's native 262,144. Push it only after re-reading `KV self size` from
; the load log; see the learnings doc for what the next steps up cost.
ctx-size      = 190000
parallel      = 2
; The 190k is ONE shared pool, not two fixed halves. llama-server has no
; per-slot context size — without this, `parallel = 2` would hard-partition the
; cache into 95k + 95k and a long conversation would hit a wall while the second
; slot sat empty. Unified lets an interactive chat grow toward the whole 190k
; while a background structured call takes only the few thousand tokens it
; needs. `parallel = 2` still caps concurrency at two, which is the point: a
; background call (grading, journal polish, briefing) must not queue behind an
; interactive chat message. Not more than two, because llama-server has two
; slots' worth of compute to give.
kv-unified    = true
n-gpu-layers  = 999
; Out of 40 layers now, not 30 — the 28 measured for Gemma 4 26B A4B does not
; carry over. 40 = every routed expert in system RAM.
;
; MEASURED: this preset sits at 5732 MiB with ~878 MiB free, and one layer's
; experts is ~480 MiB at Q4 — so 39 would leave ~400 MiB, less than the ~370 MiB
; of CUDA context the omni preset takes when it loads beside this one. There is
; no room to trade context for expert residency at 190k ctx, which is the trade
; this whole preset exists to make in the other direction. Generation measures
; 33.7 tok/s, already faster than the 26B it replaced.
n-cpu-moe     = 40
; q8_0 KV roughly halves cache cost for no quality change worth measuring.
; Needs flash-attn, set globally. Note this applies to the 10 attention layers
; only: the DeltaNet layers' recurrent state is f32 and llama.cpp does not
; quantize it. That state is ~63 MB per sequence and does not grow with context,
; so it is a flat ~126 MB here rather than a scaling cost.
cache-type-k  = q8_0
cache-type-v  = q8_0
; Large batches let prompt processing run on the GPU even for CPU-resident
; experts, which is where this setup beats whole-layer offload most.
batch-size    = 2048
ubatch-size   = 2048
; Qwen's published *thinking-mode* sampler, chosen over its non-thinking one on
; purpose: the non-thinking preset adds presence-penalty 1.5, and this alias
; serves every chat_json() call in the app, where penalising repeated tokens
; fights the JSON grammar rather than helping it.
temp          = 1.0
top-p         = 0.95
top-k         = 20
min-p         = 0.0
; VISION. This *is* a vision-language model — the GGUF carries the
; `image-text-to-text` tag and rope.dimension_sections [11, 11, 10, 0], which is
; Qwen-VL's four-way mRoPE (time, height, width, text) — and the projector below
; is its own (`clip.projector_type = qwen3vl_merger`, base model Qwen3.6 35B
; A3B). It was off until the tower was downloaded, not because the capability was
; missing.
;
; mmproj-offload = false keeps that tower in SYSTEM RAM, and that is the whole
; reason this is safe to turn on. The F16 projector is 899 MB against ~878 MiB of
; free VRAM: it would not fit, and even at a squeeze would leave nothing for the
; vision graph's compute buffers. On the CPU it moves none of the tensors
; n-cpu-moe and n-gpu-layers place, so a text-only turn is byte-for-byte the
; request it was before.
;
; MEASURED, with the projector configured as below:
;   text generation   33.99 tok/s   (33.7 before it — no regression)
;   llama-server VRAM 5734 MiB      (5732 before it — the tower is not on the card)
;   image prompt cost 289 tokens at 640x400, 939 at 1200x760
;   image turn        ~4 s and ~12 s respectively, end to end
; So a photo costs prompt tokens and one CPU ViT pass; it does not cost the
; conversation its speed. Compare the path it replaces: a whole 12B generation on
; the CPU before the chat model saw anything.
;
; F16 over BF16 (861 MB) and F32 (1.7 GB): all three are the same tower, and F16
; is the widest-supported 16-bit format on a CPU that may lack AVX512-BF16.
;
; READ THE LOAD LOG if you change any of this. If the vision graph does not fit,
; the preset fails to load outright rather than silently shrinking anything — so
; there is no path where it quietly gets slower, and the rollback is putting
; `mmproj-auto = false` back in place of these two lines.
;
; The app still ignores all of this until "Chat model reads photos" is ticked in
; Settings → llama.cpp (the `llama_chat_vision` column). Until then chat photos
; keep going through [gemma4-12b-omni], whatever this file says.
;
; This does NOT retire [gemma4-12b-omni]: this projector reports
; `clip.has_vision_encoder` only, while Gemma's reports `has_audio_encoder` too,
; so journal audio description still needs Gemma. Checked, not assumed.
;
; NOTE ON THE FILENAME. It is renamed from the `mmproj-F16.gguf` the download
; produces. Unsloth ships every repo's projector under that same bare name, so
; `hf download ... --local-dir ~/.cache/llama.cpp` puts two different models'
; towers at one path — fetching this one overwrote Gemma's, which resolved fine
; and quietly served the wrong tower. Keep the model-qualified name here, and
; give each model its own --local-dir subdirectory (as [gemma4-12b-omni] now
; does), or the next download silently replaces one of these again.
mmproj         = /home/volodya/.cache/llama.cpp/Qwen3.6-35B-A3B-mmproj-F16.gguf
mmproj-offload = false

[gemma4-12b-omni]
mmproj-offload = false
; Everything that is not text: photo captions for journal image attachments
; (backend/ai/images.py) and non-speech audio description for audio/video ones
; (backend/ai/audio_description.py) — "a dog barking, a door slamming", distinct
; from the Parakeet/Whisper speech transcript, which stays the primary text for
; what was said.
;
; ONE preset for both, because this is an any-to-any Gemma 4: text, image and
; audio input through a single ~175 MB projector, no separate encoders. That is
; also why Settings offers one "Multimodal input" checkbox rather than two —
; there is nothing to choose between.
;
; Deliberately NOT the chat model, and deliberately CPU-only (n-gpu-layers = 0).
; Both jobs are opt-in background work with no one waiting on them, so there is
; no reason to fight [qwen36] for the 7.8 GB card: keep the ~7.4 GB of Q4
; weights resident in system RAM instead, same reasoning as WHISPER_DEVICE
; defaulting to cpu (backend/routes/stt.py).
;
; THE PROJECTOR LIVES IN ITS OWN DIRECTORY, and must stay there. Unsloth names
; every repo's projector `mmproj-<precision>.gguf`, so fetching Qwen3.6's tower
; with `--local-dir ~/.cache/llama.cpp` once overwrote this one at the shared
; path — the 168 MB Gemma file became an 861 MB Qwen one. Nothing errored: the
; path still resolved, and Gemma would have been served a Qwen vision tower,
; which surfaces as nonsense captions rather than as a failure. The subdirectory
; is what makes that unrepeatable.
;
;   hf download unsloth/gemma-4-12b-it-GGUF --include "*mmproj-BF16*" \
;     --local-dir ~/.cache/llama.cpp/gemma-4-12b-omni
;   hf download unsloth/gemma-4-12b-it-GGUF --include "*UD-Q4_K_XL*" \
;     --local-dir ~/.cache/llama.cpp
; then tick Multimodal input in Settings → llama.cpp.
model         = /home/volodya/.cache/llama.cpp/gemma-4-12b-it-UD-Q4_K_XL.gguf
mmproj        = /home/volodya/.cache/llama.cpp/gemma-4-12b-omni/mmproj-BF16.gguf
; Mirrored as _CONTEXT_TOKENS in backend/ai/audio_description.py — change both
; together. The audio encoder spends a token per 160 ms frame, so this number is
; a *duration* limit (~42 minutes) more than a text one, and it's what sets how
; long a slice of a recording that module may send in one call.
ctx-size      = 16384
n-gpu-layers  = 0
threads       = 8
; Google's published recommendation for Gemma 4, which is not Qwen's — the
; reason [*] no longer carries a sampler.
temp          = 1.0
top-p         = 0.95
top-k         = 64

[embed]
; Still nomic-embed-text-v1.5, not a newer/better embedder, and that is
; deliberate: Learning stores answer embeddings as float32 blobs on
; learning_cards and compares them by cosine similarity. A different model would
; put new vectors in a different space and silently corrupt every comparison
; against an old one. See backend/ai/embeddings.py.
model         = /home/volodya/.cache/llama.cpp/nomic-embed-text-v1.5.Q8_0.gguf
embeddings    = true
pooling       = mean
ctx-size      = 2048
n-gpu-layers  = 0
; Tiny (~140 MB) and called rarely, but it has to stay resident alongside the
; chat model — an eviction would mean reloading 22 GB on the next chat message.
