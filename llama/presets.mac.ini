; llama-server presets for an Apple Silicon Mac: the production chat model,
; for running the live chat evals (scripts/chat_eval.py) against the same
; weights the server uses.
;
;   LLAMA_BIN=/opt/homebrew/bin/llama-server \
;   LLAMA_PRESETS=llama/presets.mac.ini ./llama/start-llama.sh
;
; Same alias and the same sampler as [qwen36] in presets.ini, so a scenario
; that fails here fails for the same reason it would in production. What
; differs is placement only: unified memory has no VRAM/RAM split to tune,
; so every tensor goes to Metal and there is no n-cpu-moe. Context is far
; below production's 190k because an eval conversation is a few turns long.
; No mmproj, Gemma or embed preset: the evals are text chat and nothing else.

version = 1

[*]
jinja       = true
flash-attn  = on

[qwen36]
model         = ~/.cache/llama.cpp/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
ctx-size      = 65536
parallel      = 2
kv-unified    = true
n-gpu-layers  = 999
cache-type-k  = q8_0
cache-type-v  = q8_0
temp          = 1.0
top-p         = 0.95
top-k         = 20
min-p         = 0.0
